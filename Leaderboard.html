<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>圖書館尋寶排行榜</title>


<style>

body {

  margin: 0;

  font-family:
    Arial,
    "Microsoft JhengHei",
    sans-serif;

  background: #f4f6f8;

}


.header {

  background: #163447;

  color: white;

  padding: 22px 40px;

  font-size: 30px;

  font-weight: bold;

}


.container {

  width: 1000px;

  max-width:
    calc(100% - 40px);

  margin: 35px auto;

}


.summary {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  gap: 20px;

  margin-bottom: 20px;

  padding: 22px 28px;

  background: white;

  border-radius: 10px;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,0.08);

}


.team-count {

  font-size: 22px;

  font-weight: bold;

}


.update-info {

  color: #666;

  font-size: 16px;

}


.board {

  background: white;

  border-radius: 10px;

  overflow: hidden;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,0.1);

}


.row {

  display: grid;

  grid-template-columns:
    100px
    1.5fr
    1.5fr
    1fr;

  align-items: center;

  min-height: 80px;

  padding: 0 25px;

  border-bottom:
    1px solid #e5e5e5;

}


.header-row {

  min-height: 60px;

  background: #eef2f4;

  font-size: 17px;

  font-weight: bold;

  color: #555;

}


.rank {

  font-size: 26px;

  font-weight: bold;

}


.team-name {

  font-size: 23px;

  font-weight: bold;

}


.members {

  font-size: 19px;

  color: #555;

}


.progress-area {

  min-width: 0;

}


.progress-number {

  font-size: 22px;

  font-weight: bold;

  margin-bottom: 8px;

}


.progress-bar {

  width: 100%;

  height: 12px;

  background: #ddd;

  border-radius: 20px;

  overflow: hidden;

}


.progress-fill {

  height: 100%;

  background: #168340;

  border-radius: 20px;

  transition:
    width 0.5s ease;

}


.completed {

  color: #168340;

}


.empty {

  text-align: center;

  padding: 60px 20px;

  font-size: 22px;

  color: #777;

}


.loading {

  padding: 50px;

  text-align: center;

  font-size: 20px;

}


.error {

  padding: 30px;

  color: #c5221f;

  font-weight: bold;

}


@media (max-width: 700px) {

  .container {

    max-width:
      calc(100% - 20px);

    margin:
      20px auto;

  }


  .summary {

    display: block;

  }


  .update-info {

    margin-top: 8px;

  }


  .row {

    grid-template-columns:
      60px 1fr;

    gap: 8px;

    padding:
      15px;

  }


  .header-row {

    display: none;

  }


  .members {

    grid-column:
      2;

  }


  .progress-area {

    grid-column:
      1 / -1;

  }

}

</style>

</head>


<body>


<div class="header">

  🏆 圖書館尋寶排行榜

</div>


<div class="container">


  <div class="summary">


    <div class="team-count">

      目前共有

      <span id="teamCount">
        0
      </span>

      隊

    </div>


    <div
      id="updateInfo"
      class="update-info"
    >

      排行榜每 5 秒自動更新

    </div>


  </div>



  <div
    id="board"
    class="board"
  >

    <div class="loading">

      正在載入排行榜……

    </div>

  </div>


</div>



<script>


const board =
  document.getElementById(
    "board"
  );


const teamCount =
  document.getElementById(
    "teamCount"
  );


const updateInfo =
  document.getElementById(
    "updateInfo"
  );


let loading = false;



// ==========================================
// 取得排行榜
// ==========================================

function loadLeaderboard() {


  // 防止前一個請求還沒完成
  // 下一個又送出去
  if (loading) {

    return;

  }


  loading = true;



  google.script.run


    .withSuccessHandler(

      function(data) {


        loading = false;


        renderLeaderboard(
          data
        );

      }

    )


    .withFailureHandler(

      function(error) {


        loading = false;


        board.innerHTML =

          '<div class="error">' +

          '✗ 排行榜讀取失敗：' +

          escapeHtml(
            error.message
          ) +

          '</div>';

      }

    )


    .getLeaderboardData(currentClassId);

}



// ==========================================
// 顯示排行榜
// ==========================================

function renderLeaderboard(
  data
) {


  teamCount.textContent =
    data.teamCount;


  updateInfo.textContent =

    "最後更新：" +

    data.updatedAt +

    "　｜　每 5 秒自動更新";



  if (
    !data.teams ||
    data.teams.length === 0
  ) {

    board.innerHTML =

      '<div class="empty">' +

      '目前還沒有任何小隊完成註冊' +

      '</div>';


    return;

  }



  let html = "";


  // 標題列
  html +=

    '<div class="row header-row">' +

      '<div>排名</div>' +

      '<div>小隊名稱</div>' +

      '<div>隊員</div>' +

      '<div>尋寶進度</div>' +

    '</div>';



  data.teams.forEach(

    function(team) {


      let rankText =
        team.rank;


      // 前三名顯示獎牌
      if (team.rank === 1) {

        rankText =
          "🥇 " +
          team.rank;

      }

      else if (
        team.rank === 2
      ) {

        rankText =
          "🥈 " +
          team.rank;

      }

      else if (
        team.rank === 3
      ) {

        rankText =
          "🥉 " +
          team.rank;

      }



      let percentage =

        team.totalCount > 0

          ? (
              team.foundCount /
              team.totalCount
            ) * 100

          : 0;


      percentage =
        Math.min(
          100,
          percentage
        );



      html +=

        '<div class="row">' +


          '<div class="rank">' +

            rankText +

          '</div>' +


          '<div class="team-name">' +

            escapeHtml(
              team.teamName
            ) +

          '</div>' +


          '<div class="members">' +

            escapeHtml(
              team.member1Id
            ) +

            '、' +

            escapeHtml(
              team.member2Id
            ) +

          '</div>' +


          '<div class="progress-area">' +


            '<div class="progress-number ' +

              (
                team.completed
                  ? "completed"
                  : ""
              ) +

            '">' +

              (
                team.completed
                  ? "✓ "
                  : ""
              ) +

              team.foundCount +

              " / " +

              team.totalCount +

            '</div>' +


            '<div class="progress-bar">' +

              '<div ' +

                'class="progress-fill" ' +

                'style="width:' +

                percentage +

                '%">' +

              '</div>' +

            '</div>' +


          '</div>' +


        '</div>';

    }

  );


  board.innerHTML =
    html;

}



// ==========================================
// 防止特殊字元
// ==========================================

function escapeHtml(
  text
) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      text || ""
    );


  return div.innerHTML;

}



// ==========================================
// 第一次載入
// ==========================================

loadLeaderboard();



// ==========================================
// 每 5 秒自動重新取得資料
// ==========================================

setInterval(

  loadLeaderboard,

  5000

);


</script>


</body>

</html>
